name: Ubuntu build and test

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  # A quick check (well under a minute) of all shell scripts against bash 3.2, which is
  # /bin/bash on macOS, so that a script bash 3.2 cannot handle fails on every push
  # rather than a week later in the macOS test run. It runs in parallel with the other jobs.
  bash32compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Get bash 3.2 (official Docker image, pinned by digest)
        run: |
          # bash 3.2.57 is the version of macOS /bin/bash. Docker Hub and the AWS and Google mirrors
          # of the Docker Official Images serve the same multi-arch image index (same digest), so if
          # Docker Hub fails or rate-limits the pull, the identical image comes from a mirror.
          BASH32_DIGEST="sha256:0fd7cb8499c63a3c9345e7088a9cd83bb69f6e895e83833859aff838a0312091"
          BASH32_IMAGE=""
          for BASH32_REPOSITORY in docker.io/library/bash public.ecr.aws/docker/library/bash mirror.gcr.io/library/bash ;do
            if docker pull -q "$BASH32_REPOSITORY@$BASH32_DIGEST" ;then
              BASH32_IMAGE="$BASH32_REPOSITORY@$BASH32_DIGEST"
              break
            fi
            sleep 10
          done
          if [ -z "$BASH32_IMAGE" ];then
            echo "::error::could not pull the bash 3.2 image from Docker Hub or its mirrors"
            exit 1
          fi
          # A wrapper running bash 3.2 in the container with the current directory mounted
          # at the same path, so it takes the same file names as a local bash binary
          printf '#!/bin/sh\nexec docker run --rm -v "$PWD":"$PWD" -w "$PWD" %s bash "$@"\n' "$BASH32_IMAGE" > "$RUNNER_TEMP/bash32"
          chmod +x "$RUNNER_TEMP/bash32"
          "$RUNNER_TEMP/bash32" --version
      - name: Check shell scripts with bash 3.2 and the current bash
        run: lib/check_bash32_compatibility.sh "$RUNNER_TEMP/bash32"

  ubuntu2204build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Update apt-get
        run: sudo apt-get update
      - name: Fix
        run: sudo apt-get install -f
      - name: Install gfortran
        run: sudo apt-get install gfortran
      - name: Install libpng
        run: sudo apt-get install libpng-dev
      - name: Install ghostscript
        run: sudo apt-get install ghostscript
      - name: Install shellcheck
        run: sudo apt-get install shellcheck
      - name: make VaST
        run: make
      - name: Shellcheck VaST BASH scripts
        run: |
          for i in lib/*sh util/*sh util/transients/*sh util/examples/*sh; do
            shellcheck --severity=error $i
          done

  ubuntuLatestBuildAndTest:
    needs: ubuntu2204build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update apt-get
        run: sudo apt-get update
      - name: Install gfortran
        run: sudo apt-get install gfortran
      - name: Install X11 dev package
        run: sudo apt-get install libx11-dev
      - name: Install libpng
        run: sudo apt-get install libpng-dev
      - name: Install ghostscript
        run: sudo apt-get install ghostscript
      - name: Install astropy (Python)
        run: |
          sudo apt-get install python3-pip
          pip3 install astropy
          python3 -c "import astropy; print(astropy.__version__)"
      - name: Install sympy for SIP-PV conversion test (Python)
        run: |
          pip3 install sympy
          python -c "import sympy; print(sympy.__version__)"
      - name: Install dependencies for CometFinder (Python)
        run: |
          pip3 install -r util/comet_finder/requirements.txt
          python3 -c "import skyfield; print(skyfield.__version__)"
          python3 -c "import numpy; print(numpy.__version__)"
          python3 -c "import pandas; print(pandas.__version__)"
      # The two selenium-related install steps are allowed to fail:
      # test_vast.sh skips the selenium tests when the selenium module is
      # missing (NOT_PERFORMED_*_SELENIUM_TEST) and strips selenium test
      # outcomes from the final failure list, so a transient PyPI or snap
      # store outage must not kill the whole CI run before make even starts.
      - name: Install Selenium + requests (Python, optional)
        continue-on-error: true
        run: |
          pip3 install --upgrade selenium requests
          python3 -c "import selenium; print(selenium.__version__)"
          python3 -c "import requests; print(requests.__version__)"
      - name: Install Chromium and ChromeDriver (optional)
        continue-on-error: true
        run: |
          sudo apt-get install -y chromium-browser chromium-chromedriver || { echo "chromium install failed (transient snap store error?) - retrying in 30 s"; sleep 30; sudo apt-get install -y chromium-browser chromium-chromedriver; }
          chromium-browser --version
          chromedriver --version
      - name: Install shellcheck
        run: sudo apt-get install shellcheck
      - name: make VaST
        run: make
      - name: Syntax-check the test script
        run: bash -n util/examples/test_vast.sh
      - name: Syntax-check the NMW transient search script
        run: bash -n util/transients/transient_factory_test31.sh
      - name: Check commit message
        id: check_commit
        run: |
          commit_message=$(git log --format=%B -n 1 ${{ github.event.after }})
          if [[ "${commit_message}" == *"notest"* ]]; then
            echo "Commit contains 'notest'. Skipping tests."
            echo "SKIP=true" >> $GITHUB_ENV
          else
            echo "SKIP=false" >> $GITHUB_ENV
          fi
      - name: Prepare for the test
        run: |
          if [ "$GITHUB_REPOSITORY" = "kirxkirx/vast" ]; then
            echo "1" > ../THIS_IS_HPCC
          fi
          mkdir -p test_artifacts
        if: env.SKIP != 'true' && (github.repository == 'kirxkirx/vast' || github.event_name == 'workflow_dispatch')
      - name: Test VaST
        env:
          #TEST_VAST_CURL_PROXY: ${{ secrets.TEST_VAST_CURL_PROXY }}
          TNS_ID: ${{ secrets.TNS_ID }}
          TNS_NAME: ${{ secrets.TNS_NAME }}
        run: |
          util/examples/test_vast.sh 2>&1 | tee test_artifacts/test_vast_full_output.log
          exit ${PIPESTATUS[0]}
        timeout-minutes: 300
        if: env.SKIP != 'true' && (github.repository == 'kirxkirx/vast' || github.event_name == 'workflow_dispatch')
      - name: Collect additional test artifacts
        run: |
          cp vast_test_incremental_list_of_failed_test_codes.txt test_artifacts/ 2>/dev/null || true
          cp artificial_star_recovery_terminal_output.txt test_artifacts/ 2>/dev/null || true
          # Whatever a hanging test left behind: without this a run killed at the
          # job time limit uploads no evidence at all of what it was stuck on.
          cp -- *_terminal_output*.tmp test_artifacts/ 2>/dev/null || true
          cp vast_test_report.txt test_artifacts/ 2>/dev/null || true
        if: always() && env.SKIP != 'true' && (github.repository == 'kirxkirx/vast' || github.event_name == 'workflow_dispatch')
      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: test_artifacts/
          retention-days: 7
        if: always() && env.SKIP != 'true' && (github.repository == 'kirxkirx/vast' || github.event_name == 'workflow_dispatch')
